<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../sablon/vega.css">
<style>
.row{display:flex;align-items:center;gap:26px;margin:0 0 26px}
.lab{width:290px;font-family:M;font-weight:800;font-size:34px;color:var(--ink)}
.track{flex:1;height:70px;border-radius:20px;background:#EEF1F7;position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:0;bottom:0;border-radius:20px}
.num{position:absolute;left:24px;top:50%;transform:translateY(-50%);font-family:M;font-weight:800;font-size:24px;color:#fff;letter-spacing:1px}
</style></head><body>
<div class="slide" data-name="04-tiklama-musteri">
  <div class="blob" style="width:620px;height:620px;background:var(--pink);right:-220px;top:-200px"></div>
  <div class="blob" style="width:560px;height:560px;background:var(--blue);left:-260px;top:420px;opacity:.35"></div>
  <div class="blob" style="width:600px;height:600px;background:var(--mint);right:-160px;bottom:-260px"></div>
  <div class="dots"></div><div class="grain"></div>

  <div style="position:absolute;left:84px;top:120px"><span class="pill" style="background:var(--green)">ÖLÇÜMLEME</span></div>
  <div class="h1" style="position:absolute;left:84px;top:210px;width:900px">Tıklama,<br><span class="mk">müşteri</span> değildir.</div>

  <div class="glass" style="position:absolute;left:84px;right:84px;top:520px;padding:58px 54px 34px">
    <div class="row"><div class="lab">Tıklama</div><div class="track"><div class="bar" style="width:100%;background:linear-gradient(90deg,#2D6BFF,#5B8BFF)"></div></div></div>
    <div class="row"><div class="lab">Mesaj</div><div class="track"><div class="bar" style="width:64%;background:linear-gradient(90deg,#5B6CF5,#9B6BEA)"></div></div></div>
    <div class="row"><div class="lab">Nitelikli<br>talep</div><div class="track"><div class="bar" style="width:40%;background:linear-gradient(90deg,#B65FD9,#E2589F)"></div></div></div>
    <div class="row"><div class="lab">Satış</div><div class="track"><div class="bar" style="width:20%;background:linear-gradient(90deg,#FF4F8B,#FF6F7F)"></div></div></div>
  </div>

  <div class="p" style="position:absolute;left:84px;top:1080px;width:700px;color:var(--ink);font-weight:600">Raporunuzda hangi basamağı takip ediyorsunuz?</div>
  <img class="logo" src="../../../assets/logo/logo-lacivert.png">
</div>
</body></html>
